<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IML DEPOT ADILABAD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
    --sidebar-w: 250px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  ::-webkit-scrollbar { width:5px; height:5px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  /* ─── LOGIN ─────────────────────────────────────── */
  #loginScreen {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
    background: radial-gradient(ellipse at 30% 50%, #1a2a4a 0%, #0a0f1e 60%),
                radial-gradient(ellipse at 70% 20%, #2a1a0a 0%, transparent 50%);
  }
  .login-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:48px 40px; width:100%; max-width:420px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .login-logo { text-align:center; font-size:52px; margin-bottom:20px; }
  .login-title { text-align:center; font-size:22px; font-weight:900; letter-spacing:3px; color:var(--accent); margin-bottom:6px; }
  .login-sub { text-align:center; font-size:12px; color:var(--text3); letter-spacing:1px; margin-bottom:36px; line-height:1.6; }
  .form-group { margin-bottom:18px; }
  .form-label { display:block; font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--text3); margin-bottom:8px; }
  .form-input {
    width:100%; padding:13px 16px; background:#0a0f1e; border:1.5px solid var(--border);
    border-radius:10px; color:var(--text); font-size:14px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.2s;
  }
  .form-input:focus { border-color:var(--accent); }
  .login-btn {
    width:100%; padding:14px; background:var(--accent); color:#0a0f1e;
    border:none; border-radius:10px; font-weight:900; font-size:14px;
    letter-spacing:2px; cursor:pointer; margin-top:8px; transition:opacity 0.2s;
  }
  .login-btn:hover { opacity:0.9; }
  .login-hint { margin-top:24px; background:#0a0f1e; border-radius:10px; padding:14px 16px; }
  .login-hint p { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; line-height:2; }
  .login-err { color:var(--red); font-size:12px; text-align:center; margin-top:8px; }

  /* ─── APP LAYOUT ─────────────────────────────────── */
  #appScreen { display:none; height:100vh; overflow:hidden; }
  .app-layout { display:flex; height:100vh; }

  /* ─── SIDEBAR ────────────────────────────────────── */
  .sidebar {
    width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; position:relative; z-index:100;
    transition:transform 0.3s ease;
  }
  .sidebar-top { padding:22px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  .sidebar-logo { font-size:28px; }
  .sidebar-brand { font-size:13px; font-weight:900; letter-spacing:3px; color:var(--accent); }
  .sidebar-sub { font-size:9px; color:var(--text3); letter-spacing:2px; }
  .nav { flex:1; padding:14px 10px; overflow-y:auto; }
  .nav-label { font-size:9px; font-weight:700; letter-spacing:2px; color:var(--text3); padding:12px 12px 6px; }
  .nav-item {
    display:flex; align-items:center; gap:11px; width:100%; padding:11px 14px;
    border:none; background:transparent; color:var(--text2); cursor:pointer;
    border-radius:10px; font-size:13px; font-family:'Inter',sans-serif;
    text-align:left; margin-bottom:2px; transition:all 0.15s;
  }
  .nav-item:hover { background:var(--surface2); color:var(--text); }
  .nav-item.active { background:var(--accent); color:#0a0f1e; font-weight:700; }
  .nav-icon { font-size:16px; width:22px; text-align:center; flex-shrink:0; }
  .sidebar-bottom { padding:14px; border-top:1px solid var(--border); }
  .user-card { display:flex; align-items:center; gap:10px; padding:12px; background:var(--surface2); border-radius:10px; margin-bottom:10px; }
  .user-avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#0a0f1e; font-weight:900; font-size:15px; flex-shrink:0; }
  .user-name { font-size:13px; font-weight:600; }
  .user-role { font-size:10px; color:var(--text3); margin-top:2px; }
  .logout-btn { width:100%; padding:9px; background:transparent; border:1px solid var(--border); color:var(--text2); border-radius:8px; cursor:pointer; font-size:12px; font-family:'Inter',sans-serif; transition:all 0.2s; }
  .logout-btn:hover { background:var(--red); color:#fff; border-color:var(--red); }

  /* ─── MOBILE OVERLAY ─────────────────────────────── */
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; }
  @media(max-width:768px) {
    .sidebar { position:fixed; top:0; left:0; height:100%; transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .sidebar-overlay.open { display:block; }
  }

  /* ─── MAIN ───────────────────────────────────────── */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .header { padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:12px; }
  .header-left { display:flex; align-items:center; gap:14px; min-width:0; }
  .hamburger { display:none; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer; font-size:16px; flex-shrink:0; }
  @media(max-width:768px) { .hamburger { display:block; } }
  .header-title { font-size:18px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-date { font-size:11px; color:var(--text3); margin-top:2px; }
  .role-badge { padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; flex-shrink:0; }
  .role-admin { background:#f59e0b22; color:var(--accent); border:1px solid #f59e0b44; }
  .role-viewer  { background:#3b82f622; color:var(--accent2); border:1px solid #3b82f644; }
  .role-sales   { background:#10b98122; color:#10b981; border:1px solid #10b98144; }
  .role-excise  { background:#a855f722; color:#a855f7; border:1px solid #a855f744; }
  .role-office  { background:#06b6d422; color:#06b6d4; border:1px solid #06b6d444; }
  .content { flex:1; overflow-y:auto; padding:20px; }

  /* ─── CARDS ──────────────────────────────────────── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:18px; }
  .card-title { font-size:15px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:900px) { .two-col { grid-template-columns:1fr; } }

  /* ─── STATS ──────────────────────────────────────── */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  @media(max-width:1100px) { .stats-grid { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:500px) { .stats-grid { grid-template-columns:1fr 1fr; } }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; align-items:center; gap:14px; }
  .stat-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .stat-val { font-size:19px; font-weight:900; line-height:1; }
  .stat-lbl { font-size:11px; color:var(--text3); margin-top:4px; }

  /* ─── TABLE ──────────────────────────────────────── */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:10px 12px; background:#0a0f1e; color:var(--text3); font-size:10px; letter-spacing:1px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid var(--surface2); color:#cbd5e1; vertical-align:middle; }
  tr:hover td { background:#ffffff05; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }

  /* ─── FILTER ROW ─────────────────────────────────── */
  .filter-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search-box { display:flex; align-items:center; gap:6px; background:#0a0f1e; border:1px solid var(--border); border-radius:8px; padding:7px 12px; }
  .search-input { background:transparent; border:none; color:var(--text); outline:none; font-size:13px; font-family:'Inter',sans-serif; width:150px; }
  @media(max-width:500px) { .search-input { width:100px; } }
  select.filter-sel { background:#0a0f1e; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif; }
  .btn-primary { background:var(--accent); color:#0a0f1e; border:none; border-radius:8px; padding:8px 16px; font-weight:800; cursor:pointer; font-size:13px; font-family:'Inter',sans-serif; white-space:nowrap; }
  .btn-secondary { background:var(--surface2); border:1px solid var(--border); color:var(--text2); border-radius:8px; padding:8px 16px; font-weight:600; cursor:pointer; font-size:13px; font-family:'Inter',sans-serif; white-space:nowrap; }
  .btn-danger { background:var(--red); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-weight:700; cursor:pointer; font-size:13px; font-family:'Inter',sans-serif; }

  /* ─── PAGINATION ─────────────────────────────────── */
  .pagination { display:flex; gap:5px; margin-top:14px; flex-wrap:wrap; }
  .page-btn { padding:5px 10px; background:#0a0f1e; border:1px solid var(--border); color:var(--text3); border-radius:6px; cursor:pointer; font-size:12px; }
  .page-btn.active { background:var(--accent); color:#0a0f1e; border-color:var(--accent); font-weight:700; }

  /* ─── UPLOAD ─────────────────────────────────────── */
  .upload-area { border:2px dashed var(--border); border-radius:12px; padding:36px 20px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .upload-area:hover { border-color:var(--accent); background:#f59e0b08; }
  .upload-icon { font-size:36px; margin-bottom:12px; }
  .upload-text { font-size:14px; color:var(--text2); margin-bottom:4px; }
  .upload-sub { font-size:11px; color:var(--text3); }
  .pdf-info { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#0a0f1e; border-radius:8px; margin-top:12px; font-size:13px; flex-wrap:wrap; gap:8px; }

  /* ─── MODAL ──────────────────────────────────────── */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:1000; align-items:center; justify-content:center; padding:16px; }
  .modal.open { display:flex; }
  .modal-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px; width:100%; max-width:580px; max-height:90vh; overflow-y:auto; animation:fadeUp 0.25s ease; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  .modal-title { font-size:16px; font-weight:700; }
  .close-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text2); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:500px) { .form-grid { grid-template-columns:1fr; } }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }

  /* ─── SUMMARY BAR ────────────────────────────────── */
  .summary-bar { display:flex; justify-content:flex-end; gap:28px; padding:11px 14px; background:#0a0f1e; border-radius:8px; margin-top:12px; font-size:12px; color:var(--text3); flex-wrap:wrap; gap:12px; }
  .summary-bar b { color:var(--text); }

  /* ─── REPORT STATS ───────────────────────────────── */
  .report-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
  @media(max-width:600px) { .report-stats { grid-template-columns:1fr; } }
  .report-stat { background:#0a0f1e; border-radius:10px; padding:16px; text-align:center; }
  .report-stat-val { font-size:20px; font-weight:900; color:var(--accent); }
  .report-stat-lbl { font-size:11px; color:var(--text3); margin-top:4px; }

  /* ─── STOCK GRID ─────────────────────────────────── */
  .stock-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media(max-width:900px) { .stock-grid { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:500px) { .stock-grid { grid-template-columns:1fr; } }
  .stock-card { background:#0a0f1e; border-radius:10px; padding:16px; }
  .stock-brand { font-size:13px; font-weight:700; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); color:var(--text); }
  .stock-row { display:flex; justify-content:space-between; font-size:12px; color:var(--text3); margin-bottom:6px; }
  .stock-total { display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding-top:8px; border-top:1px solid var(--border); margin-top:4px; }

  /* ─── DENIED ─────────────────────────────────────── */
  .denied { text-align:center; padding:80px 20px; }
  .denied-icon { font-size:64px; margin-bottom:16px; }
  .denied-title { font-size:22px; font-weight:700; margin-bottom:8px; }
  .denied-text { color:var(--text3); font-size:14px; }

  /* ─── TOAST ──────────────────────────────────────── */
  #toast { position:fixed; bottom:24px; right:24px; padding:12px 22px; border-radius:10px; font-size:13px; font-weight:700; color:#0a0f1e; z-index:9999; display:none; animation:slideUp 0.3s ease; }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* ─── MOBILE RESPONSIVE ──────────────────────────── */
  @media(max-width:500px) {
    .card { padding:16px; }
    .content { padding:14px; }
    .header { padding:12px 16px; }
    .stat-val { font-size:16px; }
    .header-title { font-size:15px; }
  }
  @media(max-width:700px) {
    #uploadGrid, div[style*="grid-template-columns:repeat(2,1fr)"] { grid-template-columns:1fr !important; }
  }
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- ══════════════════ LOGIN SCREEN ══════════════════ -->
<div id="loginScreen" style="display:flex">
  <div class="login-card">
    <div class="login-logo">🍺</div>
    <h1 class="login-title">IML DEPOT ADILABAD</h1>
    <p class="login-sub">IML Depot Adilabad — Sales & Receipts Portal<br>Authorized Access Only</p>
    <div class="form-group">
      <label class="form-label">USERNAME</label>
      <input class="form-input" id="loginUser" type="text" placeholder="Enter username" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">PASSWORD</label>
      <input class="form-input" id="loginPass" type="password" placeholder="Enter password">
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <input type="checkbox" id="rememberMe" style="width:16px;height:16px;accent-color:#f59e0b;cursor:pointer">
      <label for="rememberMe" style="font-size:12px;color:#94a3b8;cursor:pointer">Remember me (auto login)</label>
    </div>
    <div id="loginErr" class="login-err"></div>
    <button class="login-btn" onclick="doLogin()">SIGN IN →</button>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <div style="flex:1;height:1px;background:#1e2d45"></div>
      <span style="font-size:11px;color:#334155">or</span>
      <div style="flex:1;height:1px;background:#1e2d45"></div>
    </div>
    <button onclick="enterViewerMode()" style="width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1.5px solid #3b82f644;background:transparent;color:#3b82f6;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;letter-spacing:1px">👁 VIEWERS</button>
    <div class="login-hint" style="text-align:center">
      <p style="color:#334155;font-size:11px">IML Depot Adilabad — Authorized Access Only</p>
      <p style="color:#1e2d45;font-size:10px">Contact Admin for credentials</p>
    </div>
  </div>
</div>

<!-- ══════════════════ VIEWER SCREEN ══════════════════════ -->
<div id="viewerScreen" style="display:none;min-height:100vh;background:#0a0f1e;align-items:flex-start;justify-content:center;padding:20px 0">
  <div id="viewerContent" style="width:100%;display:flex;justify-content:center"></div>
</div>

<!-- ══════════════════ APP SCREEN ══════════════════════ -->
<div id="appScreen" style="display:none">
  <div class="app-layout">

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">🍺</div>
        <div>
          <div class="sidebar-brand">IML DEPOT</div>
          <div class="sidebar-sub">ADILABAD</div>
        </div>
      </div>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Admin</div>
            <div class="user-role" id="userRoleTxt">Administrator</div>
          </div>
        </div>
        <button class="logout-btn" onclick="doLogout()">⏻ Sign Out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <div class="header">
        <div class="header-left">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <div>
            <div class="header-title" id="pageTitle">Dashboard</div>
            <div class="header-date" id="headerDate"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="role-badge" id="roleBadge">ADMIN</div>
          <button onclick="downloadHTML()" title="Download this website" style="background:#1e2d45;border:1px solid #334155;color:#94a3b8;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:Inter,sans-serif;display:flex;align-items:center;gap:6px" onmouseover="this.style.background='#f59e0b';this.style.color='#0a0f1e';this.style.borderColor='#f59e0b'" onmouseout="this.style.background='#1e2d45';this.style.color='#94a3b8';this.style.borderColor='#334155'">
            ⬇ Download
          </button>
        </div>
      </div>
      <div class="content" id="pageContent"></div>
    </div>
  </div>
</div>

<!-- ══════════════════ MODAL ══════════════════════════ -->
<div class="modal" id="mainModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">New Entry</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>

    ? indentData.lastRefresh.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})
      + ' — ' + indentData.lastRefresh.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})

    + '</div>'

    // Last updated
    + '<div style="font-size:11px;color:#475569;margin-bottom:16px;text-align:center">Last Updated: '+lastUpd+'</div>'

    // Stats grid
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">'
    + '<div style="background:#111827;border-radius:12px;padding:16px;text-align:center;border:1px solid #1e2d45"><div style="font-size:11px;color:#64748b;margin-bottom:4px">Indents</div><div style="font-size:30px;font-weight:900;color:#1d4ed8">'+fmt(s.totalIndents)+'</div></div>'

function applyLogin(u) {

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('userAvatar').textContent = u.name[0];
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRoleTxt').textContent = u.dept || u.role;
  document.getElementById('roleBadge').textContent =
    u.role==='admin'?'👑 ADMIN':u.role==='sales'?'📈 SALES':u.role==='excise'?'🏛 EXCISE':'🏢 OFFICE';

    (u.role==='admin'?'role-admin':u.role==='sales'?'role-sales':u.role==='excise'?'role-excise':'role-office');
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  loadMonthlyData();
  startIndentTimer();
  buildNav();
  navigate('dashboard');
  const fb = document.getElementById('floatDownloadBtn');
  if(fb) fb.style.display = 'block';
}

  const remember = document.getElementById('rememberMe').checked;
  if(!un || !pw) { document.getElementById('loginErr').textContent='❌ Username & Password enter చేయండి.'; return; }
  const u = USERS.find(x => x.username===un && x.password===pw);
  if(!u) { document.getElementById('loginErr').textContent='❌ Invalid credentials. Try again.'; return; }
  if(u.active===false) { document.getElementById('loginErr').textContent='❌ Account inactive. Contact Admin.'; return; }
  if(remember) {
    try { localStorage.setItem('iml_remember', JSON.stringify({username:un, password:pw})); } catch(e){}
  } else {
    try { localStorage.removeItem('iml_remember'); } catch(e){}
  }
  applyLogin(u);
}

  currentUser = null;

window.addEventListener('load', function() {
  // Check remembered credentials
  try {
    const remembered = localStorage.getItem('iml_remember');
    if(remembered) {
      const creds = JSON.parse(remembered);
      const u = USERS.find(x => x.username===creds.username && x.password===creds.password);
      if(u) { applyLogin(u); return; }
    }
  } catch(e){}
  // Check session
  try {
    const saved = sessionStorage.getItem('iml_user');
    if(saved) {
      const savedUser = JSON.parse(saved);
      const u = USERS.find(x => x.id === savedUser.id && x.username === savedUser.username);
      if(u) { applyLogin(u); return; }
    }
  } catch(e){}
  // Pre-fill if remembered
  try {
    const remembered = localStorage.getItem('iml_remember');
    if(remembered) {
      const creds = JSON.parse(remembered);
      document.getElementById('loginUser').value = creds.username || '';
      document.getElementById('loginPass').value = creds.password || '';
      document.getElementById('rememberMe').checked = true;
    }
  } catch(e){}
  document.getElementById('loginScreen').style.display='flex';
});

let _dashCache = null;
function getDashCache() {
  if(!_dashCache) {
    _dashCache = {
      shops: retailers.filter(r=>r.type==='Shop').length,
      bars:  retailers.filter(r=>r.type==='Bar').length,
      areas: ['Adilabad','Asifabad','Bhainsa','Echoda','Kagaznagar','Nirmal','Utnoor'].map(area=>({
        name: area,
        shops: retailers.filter(r=>r.area===area&&r.type==='Shop').length,
        bars:  retailers.filter(r=>r.area===area&&r.type==='Bar').length,
      }))
    };
  }
  return _dashCache;
}

function sortMonths(keys) {
  var mo = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return keys.slice().sort(function(a, b) {
    var ap = a.split(' '), bp = b.split(' ');
    var ay = parseInt(ap[ap.length-1])||0, by = parseInt(bp[bp.length-1])||0;
    if(ay !== by) return ay - by;
    return mo.indexOf(ap[0]) - mo.indexOf(bp[0]);
  });
}

function switchBatch(batch) {
  currentBatch = batch;
  retailers = allRetailerBatches[batch];
  retailerSearch = ''; retailerArea = 'All'; retailerPageNum = 1;
  renderRetailers();
}

function addNewBatch() {
  const yr = document.getElementById('newBatchYear')?.value?.trim();
  if(!yr || !yr.match(/^\d{4}-\d{4}$/)) {
    alert('Please enter valid period format: e.g. 2027-2029');
    return;
  }
  if(allRetailerBatches[yr]) {
    alert('This period already exists!');
    return;
  }
  // Clone current batch as starting point — user can upload new PDF to replace
  allRetailerBatches[yr] = allRetailerBatches[currentBatch].map(r=>({...r, batch:yr, valid:'30-Nov-'+yr.split('-')[1]}));
  toast('✅ New period '+yr+' created! Upload new PDF to update retailer data.');
  switchBatch(yr);
}

function handlePdf(input) {
  if(input.files[0]) {
    retailerPdf = input.files[0].name;
    renderRetailers();
    toast('✅ Retailer Master PDF uploaded!');
  }
}

        </tr></tbody>
      </table></div></div>`;

}

function printRpt() {
  // Comparative report — print directly from rendered table
  if(rType === 'comparative') {
    var el = document.getElementById('reportPrintArea');
    if(!el) { toast('⚠ ముందు Generate చేయండి', '#ef4444'); return; }
    var w = window.open('','_blank');
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comparative Statement</title>'
      + '<style>@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;font-size:10px;color:#000;background:#fff}'
      + 'table{width:100%;border-collapse:collapse}th,td{border:1px solid #a08050;padding:5px 6px}'
      + 'th{background:#c8a96e;color:#1e293b;font-size:9px;font-weight:700;text-align:center}'
      + 'tr:nth-child(even) td{background:#f8f5ee}'
      + '.total-row td{background:#c8a96e!important;font-weight:900;color:#1e293b}'
      + '.no-print{display:none}'
      + '@media print{.no-print{display:none!important}}'
      + '</style></head><body>'
      + '<div class="no-print" style="text-align:center;padding:10px;background:#1e3a5f;color:#fff;margin-bottom:12px">'
      + '<button onclick="window.print()" style="background:#fff;color:#1e3a5f;border:none;padding:6px 18px;font-weight:900;border-radius:6px;cursor:pointer;font-size:13px">🖨 Print / Save PDF</button></div>'
      + el.innerHTML
      + '</body></html>');
    w.document.close();
    w.onload = function() { w.print(); };
    return;
  }
  const data = MONTHLY_DATA[activeMonth] || [];
  if(!data.length) { toast('⚠ CSV data లేదు — ముందు upload చేయండి', '#ef4444'); return; }

  const filtered = data.filter(r => {
    const rl = retailers.find(x => x.code === r.code);
    if(!rl) return rCircle === 'All';
    if(rCircle==='Shops Only') return rl.type==='Shop';
    if(rCircle==='Bars Only')  return rl.type==='Bar';
    if(rCircle==='All') return true;
    return rl.area === rCircle;
  }).sort((a,b) => (a.name||'').localeCompare(b.name||''));

  const fmt = n => Number(n||0).toLocaleString('en-IN');
  const imlData  = filtered.filter(r => (r.imlFull||0) > 0 || (r.imlPart||0) > 0);
  const beerData = filtered.filter(r => (r.beerFull||0) > 0 || (r.beerPart||0) > 0);

function showCreateUserModal() {
  document.getElementById('modalTitle').textContent = '➕ New User';
  document.getElementById('editUserId').value = '';
  document.getElementById('uName').value = '';
  document.getElementById('uDept').value = '';
  document.getElementById('uUsername').value = '';
  document.getElementById('uPassword').value = '';
  document.getElementById('uRole').value = 'sales';
  document.getElementById('userModalErr').style.display='none';
  document.getElementById('userModal').style.display='flex';
}

function showEditUserModal(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  document.getElementById('modalTitle').textContent = '✏ Edit User — ' + u.name;
  document.getElementById('editUserId').value = id;
  document.getElementById('uName').value = u.name;
  document.getElementById('uDept').value = u.dept||'';
  document.getElementById('uUsername').value = u.username;
  document.getElementById('uPassword').value = u.password;
  document.getElementById('uRole').value = u.role;
  document.getElementById('userModalErr').style.display='none';
  document.getElementById('userModal').style.display='flex';
}

function closeUserModal() {
  document.getElementById('userModal').style.display='none';
}

function saveUserModal() {
  const errEl = document.getElementById('userModalErr');
  const name = document.getElementById('uName').value.trim();
  const dept = document.getElementById('uDept').value.trim();
  const username = document.getElementById('uUsername').value.trim().toLowerCase();
  const password = document.getElementById('uPassword').value.trim();
  const role = document.getElementById('uRole').value;
  const editId = parseInt(document.getElementById('editUserId').value)||0;

  if(!name||!username||!password) { errEl.textContent='❌ Name, Username, Password required!'; errEl.style.display='block'; return; }
  if(password.length < 4) { errEl.textContent='❌ Password min 4 characters!'; errEl.style.display='block'; return; }
  if(USERS.find(u=>u.username===username && u.id!==editId)) { errEl.textContent='❌ Username already exists!'; errEl.style.display='block'; return; }

  if(editId) {
    const u = USERS.find(x=>x.id===editId);
    if(u) { u.name=name; u.dept=dept; u.username=username; u.password=password; u.role=role; }
    toast('✅ User updated!');
  } else {
    const newId = Math.max(0,...USERS.map(u=>u.id))+1;
    USERS.push({id:newId,name,dept,username,password,role,active:true});
    toast('✅ User created!');
  }
  saveUsers();
  closeUserModal();
  renderUsers();
}

function deleteUser(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(!confirm('Delete user "' + u.name + '"? This cannot be undone.')) return;
  USERS = USERS.filter(x=>x.id!==id);
  saveUsers();
  toast('🗑 User deleted!');
  renderUsers();
}

function toggleUserActive(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(u.id===currentUser.id) { toast('⚠ Cannot deactivate yourself!','#ef4444'); return; }
  u.active = u.active===false ? true : false;
  saveUsers();
  toast(u.active ? '✅ User activated!' : '⚠ User deactivated!');
  renderUsers();
}

function decodeProductCode(code) {
  if(!code || code.length < 10) return {};
  const supplier = code.substring(0,4);
  const typeChar = code.substring(4,5);
  const brand = code.substring(5,9);
  const bottle = code.substring(9,10);
  const sizeCode = code.substring(10);
  
  const typeMap = { W:'Whisky', B:'Beer', E:'Wine', Y:'Brandy', V:'Vodka', M:'RTD/Breezer', R:'Rum', G:'Gin' };
  const bottleMap = { G:'Glass', P:'PET', H:'High Density' };
  const sizeMap = { QQ:'750 ml', PP:'345 ml', NN:'180 ml', DD:'90 ml', SS:'650 ml', UU:'330 ml', GBS:'650 ml', GUP:'330 ml', CAP:'500 ml', GGP:'275 ml', GCP:'200 ml', GQM:'700 ml', LL:'1 Ltr', GNN:'180 ml', GPP:'345 ml', GQQ:'750 ml', GDD:'90 ml', GLL:'1 Ltr', PNN:'180 ml', PQQ:'750 ml', PDD:'90 ml', PPP:'345 ml', PLL:'1 Ltr', HNN:'180 ml', PXG:'375 ml' };
  
  const fullSize = code.substring(9);
  return {
    supplier,
    type: typeMap[typeChar] || typeChar,
    brand,
    bottle: bottleMap[bottle] || bottle,
    size: sizeMap[fullSize] || sizeMap[sizeCode] || fullSize
  };
}

function handleUpload(key, inputEl) {
  var file = inputEl && inputEl.files && inputEl.files[0];
  if(!file) return;
  uploadedFiles[key] = file;

  // Special handling for Licensee Indents PDF
  if(key === 'licenseeIndents') {
    indentData.file        = file;
    indentData.uploadTime  = new Date();
    indentData.lastRefresh = new Date();
    indentData.status      = 'uploaded';
    // Reset summary — user should manually enter new data or it stays from last PDF
    // Keep existing summary but update date/file reference
    indentData.summary.date = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    startIndentTimer();
    if(currentPage === 'dashboard') renderDashboard();
    toast('✅ Licensee Indents PDF uploaded! Dashboard updated.');
  }

  renderUploads();
  if(key !== 'licenseeIndents') toast('✅ ' + file.name + ' uploaded successfully!');
}

function handleMultiCsv(files) {
  if(!files || files.length === 0) return;
  let loaded = 0;
  const total = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.csv')).length;
  if(total === 0) { toast('\u26a0 CSV files select చేయండి'); return; }
  Array.from(files).forEach(function(file) {
    if(!file.name.toLowerCase().endsWith('.csv')) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      parseMonthlyCSV(file.name, e.target.result);
      loaded++;
      if(loaded === total) {
        renderUploads();
        toast('\u2705 ' + total + ' month' + (total > 1 ? 's' : '') + ' loaded!');
      }
    };
    reader.readAsText(file);
  });
}

function parseMonthlyCSV(filename, text) {
  try {
    var lines = text.trim().split('\n').filter(function(l) { return l.trim(); });
    if(lines.length < 2) return;
    var headers = lines[0].split(',').map(function(h) { return h.trim().replace(/"/g, '').toUpperCase(); });
    var iRetCode = headers.indexOf('RETAILER_CODE');
    var iRetName = headers.indexOf('RETAILER_NAME');
    var iProdName = headers.indexOf('PRODUCT_NAME');
    var iImlF  = headers.indexOf('IML_FULL');
    var iImlP  = headers.indexOf('IML_PART');
    var iBeerF = headers.indexOf('BEER_FULL');
    var iBeerP = headers.indexOf('BEER_PART');
    if(iRetCode < 0 || iImlF < 0) { toast('\u26a0 CSV format not recognized!', '#ef4444'); return; }
    var mMatch = filename.match(/([A-Za-z]+)[_\-](\d{4})/i);
    var mMatch2 = filename.match(/(\d{4})[_\-](\d{2})/);
    var MONTH_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
    var monthKey;
    if(mMatch) {
      monthKey = mMatch[1].charAt(0).toUpperCase() + mMatch[1].slice(1).toLowerCase() + ' ' + mMatch[2];
    } else if(mMatch2) {
      monthKey = (MONTH_NAMES[parseInt(mMatch2[2])] || mMatch2[2]) + ' ' + mMatch2[1];
    } else {
      monthKey = filename.replace('.csv','').replace(/_ADB$/i,'').replace(/-ADB$/i,'');
    }
    var retailerMap = {};
    for(var i = 1; i < lines.length; i++) {
      var cols = lines[i].split(',').map(function(c) { return c.trim().replace(/"/g,''); });
      if(cols.length < 4) continue;
      var code  = cols[iRetCode] || '';
      var name  = cols[iRetName] || '';
      var pName = (iProdName >= 0 ? cols[iProdName] : '') || '';
      var imlF  = parseInt(cols[iImlF]  || 0) || 0;
      var imlP  = parseInt(cols[iImlP]  || 0) || 0;
      var beerF = parseInt(cols[iBeerF] || 0) || 0;
      var beerP = parseInt(cols[iBeerP] || 0) || 0;
      if(!code) continue;
      if(!retailerMap[code]) retailerMap[code] = {name:name,code:code,imlFull:0,imlPart:0,beerFull:0,beerPart:0,products:0,brands:{}};
      retailerMap[code].imlFull  += imlF;
      retailerMap[code].imlPart  += imlP;
      retailerMap[code].beerFull += beerF;
      retailerMap[code].beerPart += beerP;
      if(imlF > 0 || beerF > 0) retailerMap[code].products++;
      if(pName) {
        if(!retailerMap[code].brands[pName]) retailerMap[code].brands[pName] = {imlFull:0,imlPart:0,beerFull:0,beerPart:0};
        retailerMap[code].brands[pName].imlFull  += imlF;
        retailerMap[code].brands[pName].imlPart  += imlP;
        retailerMap[code].brands[pName].beerFull += beerF;
        retailerMap[code].brands[pName].beerPart += beerP;
      }
    }
    MONTHLY_DATA[monthKey] = Object.values(retailerMap).map(function(r) {
      return Object.assign({}, r, {
        brands: Object.entries(r.brands)
          .filter(function(e) { return e[1].imlFull > 0 || e[1].beerFull > 0; })
          .map(function(e) { return Object.assign({name: e[0]}, e[1]); })
      });
    });
    activeMonth = monthKey;
    // Save to localStorage for persistence across logout/reload
    saveMonthlyData();
  } catch(err) {
    toast('\u274c CSV parse error: ' + err.message, '#ef4444');
  }
}

function saveMonthlyData() {
  try {
    // Save summary only (not brands detail) to keep size small
    var summary = {};
    sortMonths(Object.keys(MONTHLY_DATA)).forEach(function(month) {
      summary[month] = MONTHLY_DATA[month].map(function(r) {
        return {
          code: r.code, name: r.name,
          imlFull: r.imlFull, imlPart: r.imlPart,
          beerFull: r.beerFull, beerPart: r.beerPart,
          products: r.products,
          brands: r.brands || []
        };
      });
    });
    localStorage.setItem('iml_monthly_data', JSON.stringify(summary));
    localStorage.setItem('iml_active_month', activeMonth || '');
    console.log('Monthly data saved:', Object.keys(summary).length, 'months');
  } catch(e) {
    console.warn('localStorage save failed:', e.message);
  }
}

function loadMonthlyData() {
  try {
    var saved = localStorage.getItem('iml_monthly_data');
    if(saved) {
      var parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(function(month) {
        MONTHLY_DATA[month] = parsed[month];
      });
      var savedMonth = localStorage.getItem('iml_active_month');
      if(savedMonth && MONTHLY_DATA[savedMonth]) activeMonth = savedMonth;
      else if(sortMonths(Object.keys(MONTHLY_DATA)).length > 0) {
        var months = sortMonths(Object.keys(MONTHLY_DATA));
        activeMonth = months[months.length - 1];
      }
      console.log('Loaded', sortMonths(Object.keys(MONTHLY_DATA)).length, 'months from storage');
      return sortMonths(Object.keys(MONTHLY_DATA)).length > 0;
    }
  } catch(e) {
    console.warn('localStorage load failed:', e.message);
  }
  return false;
}

function getTimeSince(date) {
  if(!date) return 'N/A';
  var diff = Math.floor((new Date() - date) / 1000);
  if(diff < 60)   return diff + ' sec ago';
  if(diff < 3600) return Math.floor(diff/60) + ' min ago';
  var h = Math.floor(diff/3600);
  var m = Math.floor((diff%3600)/60);
  return h + 'h ' + (m > 0 ? m + 'm ' : '') + 'ago';
}

    td { padding:3px 4px; border:1px solid #e2e8f0; text-align:center; }
    td.fixed { text-align:left; white-space:nowrap; }
    td.name { font-size:8px; font-weight:700; }
    td.code { font-family:monospace; color:#7c3aed; font-size:8px; font-weight:700; }
    tr:nth-child(even) td { background:#f8fafc; }
    td.nonzero { font-weight:700; color:${isIML?'#d97706':'#1d4ed8'}; }
    .total-row td { background:#e8f4fd !important; font-weight:900; border-top:2px solid #1e3a5f; }
    td.grand { background:#fef3c7 !important; font-weight:900; font-size:10px; color:#92400e; }
    .no-print { display:none; }
    @media print { .no-print { display:none !important; } }
    .print-btn { text-align:center; padding:10px; background:#1e3a5f; color:#fff; margin-bottom:10px; font-size:13px; }
    .print-btn button { background:#fff; color:#1e3a5f; border:none; padding:6px 18px; font-weight:900; border-radius:6px; cursor:pointer; font-size:13px; margin-left:12px; }
  </style></head><body>
  <div class="print-btn no-print">
    🖨 Landscape PDF — <button onclick="window.print()">Print / Save PDF</button>
  </div>
  <div class="hdr">
    <p>OFFTAKE FOR THE MONTH OF ${(execMonth||'').toUpperCase()} — ${isIML?'IML (Indian Made Liquor)':'BEER'} — IML Depot Adilabad</p>
    <p>Generated: ${genDate} &nbsp;|&nbsp; Retailers: ${retailers_filtered.length} &nbsp;|&nbsp; Brands: ${allBrands.length} &nbsp;|&nbsp; Grand Total: ${grandTotal.toLocaleString('en-IN')} Cases</p>
  </div>
  <table>
    <thead>
      <tr>
        <th class="fixed" style="min-width:28px">#</th>
        <th class="fixed" style="min-width:70px">Retailer Code</th>
        <th class="fixed" style="min-width:160px">Retailer Name</th>
        ${allBrands.map(b=>`<th class="brand-hdr">${b}</th>`).join('')}
        <th class="total-hdr">GRAND TOTAL</th>
      </tr>
    </thead>
    <tbody>
      ${retailers_filtered.map((r,i)=>{
        const brandMap={};
        (r.brands||[]).forEach(b=>{ brandMap[b.name]=isIML?(b.imlFull||0):(b.beerFull||0); });
        const rowTotal=isIML?(r.imlFull||0):(r.beerFull||0);
        return `<tr>
          <td class="fixed">${i+1}</td>
          <td class="fixed code">${r.code}</td>
          <td class="fixed name">${r.name}</td>
          ${allBrands.map(b=>{
            const q=brandMap[b]||0;
            return `<td class="${q>0?'nonzero':''}">${q>0?q:''}</td>`;
          }).join('')}
          <td class="grand">${rowTotal.toLocaleString('en-IN')}</td>
        </tr>`;
      }).join('')}
      <tr class="total-row">
        <td colspan="3" class="fixed" style="text-align:right;font-size:9px">GRAND TOTAL (${retailers_filtered.length} Retailers) →</td>
        ${allBrands.map(b=>{
          const tot=retailers_filtered.reduce((s,r)=>{
            const bData=(r.brands||[]).find(x=>x.name===b);
            return s+(bData?(isIML?(bData.imlFull||0):(bData.beerFull||0)):0);
          },0);
          return `<td class="${tot>0?'nonzero':''}">${tot>0?tot:''}</td>`;
        }).join('')}
        <td class="grand" style="font-size:11px">${grandTotal.toLocaleString('en-IN')}</td>
      </tr>
    </tbody>
  </table>
  </body></html>`);
  w.document.close();
  w.onload = function() { w.print(); };
}

function exportExecCSV() {
  const data = MONTHLY_DATA[execMonth] || [];
  const isIML = execTab === 'iml';
  if(!data.length) { toast('⚠ CSV data లేదు', '#ef4444'); return; }

  const brandSet = new Set();
  data.forEach(r => (r.brands||[]).forEach(b => {
    if((isIML?(b.imlFull||0):(b.beerFull||0))>0) brandSet.add(b.name);
  }));
  const allBrands = Array.from(brandSet).sort();
  const retailers_filtered = data.filter(r=>(isIML?(r.imlFull||0):(r.beerFull||0))>0)
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  let csv = ['Sl.No','Retailer Code','Retailer Name',...allBrands,'GRAND TOTAL'].map(h=>'"'+h+'"').join(',') + '\n';
  retailers_filtered.forEach((r,i)=>{
    const brandMap={};
    (r.brands||[]).forEach(b=>{ brandMap[b.name]=isIML?(b.imlFull||0):(b.beerFull||0); });
    const rowTotal=isIML?(r.imlFull||0):(r.beerFull||0);
    const row = [i+1, r.code, '"'+r.name+'"', ...allBrands.map(b=>brandMap[b]||0), rowTotal];
    csv += row.join(',') + '\n';
  });
  // Grand Total row
  const totals = allBrands.map(b=>retailers_filtered.reduce((s,r)=>{
    const bData=(r.brands||[]).find(x=>x.name===b);
    return s+(bData?(isIML?(bData.imlFull||0):(bData.beerFull||0)):0);
  },0));
  const grandTotal = retailers_filtered.reduce((s,r)=>s+(isIML?(r.imlFull||0):(r.beerFull||0)),0);
  csv += ['"GRAND TOTAL"','','', ...totals, grandTotal].join(',') + '\n';

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Offtake_'+(isIML?'IML':'Beer')+'_'+execMonth.replace(' ','_')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ CSV downloaded!');
}

function downloadHTML() {
  try {
    var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = 'IML_Depot_Adilabad.html';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    toast('\u2705 Downloading...');
  } catch(e) {
    window.open('data:text/html;charset=utf-8,' + encodeURIComponent('<!DOCTYPE html>\n' + document.documentElement.outerHTML), '_blank');
  }
}
